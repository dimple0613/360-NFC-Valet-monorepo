name: App APK CI

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate native Android project
        working-directory: app
        run: npm run prebuild

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with timestamp
        id: rename-apk
        shell: bash
        run: |
          apk_path="app/android/app/build/outputs/apk/release/360-NFC-Valet.apk"
          timestamp=$(date +%Y%m%d%H%M)
          mv "$apk_path" "app/android/app/build/outputs/apk/release/360-NFC-Valet-${timestamp}.apk"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 360-NFC-Valet-apk-${{ steps.rename-apk.outputs.timestamp }}
          path: app/android/app/build/outputs/apk/release/360-NFC-Valet-${{ steps.rename-apk.outputs.timestamp }}.apk
