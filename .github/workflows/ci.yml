name: App APK CI

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm ci --prefer-offline

      - name: Generate native Android project
        working-directory: app
        run: npm run prebuild

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: app/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: app/android/build-log.txt

      - name: Rename APK with timestamp
        id: rename-apk
        shell: bash
        run: |
          apk_path="$(find app/android -name '*.apk' -type f 2>/dev/null | head -n1)"
          if [ -z "$apk_path" ]; then
            echo "::error::No APK produced."
            echo "Tree of app/android/app/build:"
            find app/android/app/build -maxdepth 4 -print 2>/dev/null | head -n 100 || true
            exit 1
          fi
          dest_dir="app/android/app/build/outputs/apk/release"
          mkdir -p "$dest_dir"
          timestamp=$(date +%Y%m%d%H%M)
          mv "$apk_path" "$dest_dir/360-NFC-Valet-${timestamp}.apk"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"
          echo "Renamed $(basename "$apk_path") -> $dest_dir/360-NFC-Valet-${timestamp}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 360-NFC-Valet-apk-${{ steps.rename-apk.outputs.timestamp }}
          path: app/android/app/build/outputs/apk/release/360-NFC-Valet-${{ steps.rename-apk.outputs.timestamp }}.apk
